[package]
name = "neet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Practise NeetCode 150/250 offline in the terminal, with Claude as an interview coach"
license = "Apache-2.0"
repository = "https://github.com/dtrotzky/neet-cli"
readme = "README.md"
keywords = ["neetcode", "leetcode", "interview", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
html2text = "0.17.4"
libc = "0.2.191"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }
